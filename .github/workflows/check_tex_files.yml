name: Compile paper, slides and logbook

on:
  pull_request:
    types: [opened, reopened, review_requested, ready_for_review]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The documents \input task outputs, so the tasks run first
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2

      - name: Run tasks
        run: make tasks

      - name: Link task outputs into the documents
        run: |
          for folder in paper slides logbook; do make -C "$folder" inputs; done

      - name: Compile paper
        shell: bash
        run: bash "./tasks/actions_scripts/code/check_tex_files.sh"
        env:
          INPUT_ROOT_FILE: paper.tex
          INPUT_WORKING_DIRECTORY: ./paper/
          INPUT_WORK_IN_ROOT_FILE_DIR: "false"
          INPUT_CONTINUE_ON_ERROR: "true"
          INPUT_COMPILER: latexmk
          INPUT_ARGS: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"
          INPUT_EXTRA_SYSTEM_PACKAGES: ""
          INPUT_EXTRA_FONTS: ""
          INPUT_PRE_COMPILE: ""
          INPUT_POST_COMPILE: ""
          INPUT_LATEXMK_SHELL_ESCAPE: "true"
          INPUT_LATEXMK_USE_LUALATEX: "false"
          INPUT_LATEXMK_USE_XELATEX: "false"

      - name: Compile slides
        shell: bash
        run: bash "./tasks/actions_scripts/code/check_tex_files.sh"
        env:
          INPUT_ROOT_FILE: slides.tex
          INPUT_WORKING_DIRECTORY: ./slides/
          INPUT_WORK_IN_ROOT_FILE_DIR: "false"
          INPUT_CONTINUE_ON_ERROR: "true"
          INPUT_COMPILER: latexmk
          INPUT_ARGS: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"
          INPUT_EXTRA_SYSTEM_PACKAGES: ""
          INPUT_EXTRA_FONTS: ""
          INPUT_PRE_COMPILE: ""
          INPUT_POST_COMPILE: ""
          INPUT_LATEXMK_SHELL_ESCAPE: "true"
          INPUT_LATEXMK_USE_LUALATEX: "false"
          INPUT_LATEXMK_USE_XELATEX: "false"

      - name: Compile logbook
        shell: bash
        run: bash "./tasks/actions_scripts/code/check_tex_files.sh"
        env:
          INPUT_ROOT_FILE: logbook.tex
          INPUT_WORKING_DIRECTORY: ./logbook/
          INPUT_WORK_IN_ROOT_FILE_DIR: "false"
          INPUT_CONTINUE_ON_ERROR: "true"
          INPUT_COMPILER: latexmk
          INPUT_ARGS: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"
          INPUT_EXTRA_SYSTEM_PACKAGES: ""
          INPUT_EXTRA_FONTS: ""
          INPUT_PRE_COMPILE: ""
          INPUT_POST_COMPILE: ""
          INPUT_LATEXMK_SHELL_ESCAPE: "true"
          INPUT_LATEXMK_USE_LUALATEX: "false"
          INPUT_LATEXMK_USE_XELATEX: "false"
