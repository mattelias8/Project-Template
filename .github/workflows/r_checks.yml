name: R tests, lint and example pipeline

on:
  pull_request:
    types: [opened, reopened, review_requested, ready_for_review]
  workflow_dispatch:

jobs:
  r:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Restore the R version and packages recorded in renv.lock
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2

      - name: Unit tests for lib/R
        run: make test

      - name: Lint R code
        run: make lint

      - name: Run every task in test mode
        run: make tasks TEST=TRUE
